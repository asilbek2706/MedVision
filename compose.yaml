name: medvision

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: medvision
      POSTGRES_USER: medvision
      POSTGRES_PASSWORD: medvision_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvision -d medvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/medvision
      DB_USERNAME: medvision
      DB_PASSWORD: medvision_local_password
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./server/src:/app/src
      - ./server/pom.xml:/app/pom.xml:ro
      - maven_cache:/root/.m2
      - image_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  maven_cache:
  frontend_node_modules:
  frontend_next:
  image_storage:
