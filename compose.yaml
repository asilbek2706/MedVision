name: medvision

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: medvision
      POSTGRES_USER: medvision
      POSTGRES_PASSWORD: medvision_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvision -d medvision"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: