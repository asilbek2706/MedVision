server:
  port: 8080

spring:
  application:
    name: medvision-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/medvision}
    username: ${DB_USERNAME:medvision}
    password: ${DB_PASSWORD:medvision_local_password}

  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB